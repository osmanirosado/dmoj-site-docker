server {
    listen       80;
    listen       [::]:80;
   # server_name  dmoj.ca;
    client_max_body_size 48M;

    add_header X-UA-Compatible "IE=Edge,chrome=1";
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;
    try_files $uri @icons;
    error_page 502 504 /502.html;

    location ~ ^/502\.html$|^/logo\.png$|^/robots\.txt$ {
        root /var/opt/lib/dmoj/assets/;
    }

    location @icons {
        root /var/opt/lib/dmoj/assets/static/icons/;
        log_not_found off;
        error_page 403 = @uwsgi;
        error_page 404 = @uwsgi;
    }

    location @uwsgi {
        uwsgi_read_timeout 600;
        uwsgi_pass site:8000;
        include uwsgi_params;
        uwsgi_param SERVER_SOFTWARE nginx/$nginx_version;
    }

    location /static {
        gzip_static on;
        expires max;
        root /var/opt/lib/dmoj/assets/;
    }

    location /media {
        alias /var/opt/lib/dmoj/media/;
    }

    location /pdf-cache {
        internal;
        alias /var/cache/dmoj/pdf;
    }

    location /data-cache {
        internal;
        alias /var/cache/dmoj/data;
    }

    location /mathoid {
        default_type image/svg+xml;
        alias /var/cache/dmoj/mathoid;
    }

    location /texoid {
        default_type image/svg+xml;
        alias /var/cache/dmoj/texoid;
    }

    location /event/ {
        proxy_pass http://wsevent:15100/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /channels/ {
        proxy_read_timeout 120;
        proxy_pass http://wsevent:15102/;
    }

    location /cdnjs {
        gzip_static on;
        expires max;
        root /usr/share/nginx/;
        # Comment out root, and use the following if it doesn't end in /cdnjs.
        #alias <STATIC_ROOT>;
    }

    location /wikipedia {
        gzip_static on;
        expires max;
        root /usr/share/nginx/;
        # Comment out root, and use the following if it doesn't end in /wikipedia.
        #alias <STATIC_ROOT>;
    }
}
