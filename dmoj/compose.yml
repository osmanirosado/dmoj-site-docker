services:
  db:
    container_name: dmoj-mysql
    image: mariadb
    restart: always
    volumes:
      - ./database/:/var/lib/mysql/
    env_file: [environment/mysql.env, environment/mysql-admin.env]
    networks: [db]
  redis:
    container_name: dmoj-redis
    image: redis:alpine
    restart: always
    networks: [site]
  texoid:
    build:
      context: texoid
      dockerfile: Dockerfile
    image: ninjaclasher/dmoj-texoid
    init: true
    restart: unless-stopped
    networks: [site]
  pdfoid:
    build:
      context: pdfoid
      dockerfile: Dockerfile
    image: ninjaclasher/dmoj-pdfoid
    init: true
    restart: unless-stopped
    networks: [site]
    cap_add:
      - SYS_ADMIN
  mathoid:
    build:
      context: mathoid
      dockerfile: Dockerfile
    image: ninjaclasher/dmoj-mathoid
    init: true
    restart: unless-stopped
    volumes:
      - ./mathoid/config.yaml:/home/node/node_modules/mathoid/config.yaml
    networks: [site]
  site:
    build:
      context: base
      dockerfile: Dockerfile
      target: site
    image: ninjaclasher/dmoj-site
    init: true
    restart: unless-stopped
    volumes:
      - assets:/assets/
      - pdfcache:/pdfcache/
      - datacache:/datacache/
      - cache:/cache/
      - ./media/:/media/
      - ./problems/:/problems/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx, db]
    depends_on: [db, redis]
  celery:
    build:
      context: base
      dockerfile: Dockerfile
      target: celery
    image: ninjaclasher/dmoj-celery
    init: true
    restart: unless-stopped
    volumes:
      - pdfcache:/pdfcache/
      - datacache:/datacache/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, db]
    depends_on: [db, redis]
  bridged:
    build:
      context: base
      dockerfile: Dockerfile
      target: bridged
    image: ninjaclasher/dmoj-bridged
    init: true
    restart: unless-stopped
    volumes:
      - pdfcache:/pdfcache/
      - ./problems/:/problems/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx, db]
    ports:
      - 9999:9999
    depends_on: [db, redis]
  wsevent:
    build:
      context: .
      dockerfile: wsevent/Dockerfile
    image: ninjaclasher/dmoj-wsevent
    init: true
    restart: unless-stopped
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx]
  nginx:
    container_name: dmoj-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - assets:/assets/
      - pdfcache:/pdfcache/
      - datacache:/datacache/
      - cache:/cache/
      - ./media/:/media/
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks: [nginx]
    depends_on: [site, wsevent]

networks:
  site:
  db:
  nginx:

volumes:
  assets:
  pdfcache:
  datacache:
  cache:
