name: dmoj

services:
  db:
    image: mariadb:11.8
    restart: always
    volumes:
      - db:/var/lib/mysql/
    env_file:
      - env/db.env
      - env/db-admin.env
    networks:
      - db
  redis:
    image: redis:alpine
    restart: always
    networks:
      - site
  texoid:
    build:
      context: texoid
      dockerfile: Dockerfile
    image: dmoj-texoid
    init: true
    restart: unless-stopped
    networks:
      - site
  pdfoid:
    build:
      context: pdfoid
      dockerfile: Dockerfile
    image: dmoj-pdfoid
    init: true
    restart: unless-stopped
    networks:
      - site
    cap_add:
      - SYS_ADMIN
  mathoid:
    build:
      context: mathoid
      dockerfile: Dockerfile
    image: dmoj-mathoid
    init: true
    restart: unless-stopped
    networks:
      - site
  owner:
    image: busybox
    command: "chown -R 1000:1000 /mnt/dmoj/"
    working_dir: /mnt/dmoj/
    volumes:
      - /var/spool/dmoj/:/mnt/dmoj/spool/
      - assets:/mnt/dmoj/assets/
      - pdf_cache:/mnt/dmoj/pdf/
      - data_cache:/mnt/dmoj/data/
      - mathoid_cache:/mnt/dmoj/mathoid/
      - texoid_cache:/mnt/dmoj/texoid/
      - media:/mnt/dmoj/media/
      - problems:/mnt/dmoj/problems/
      - log:/mnt/dmoj/log/
    restart: no
    profiles:
      - util
  site:
    build:
      context: site
      dockerfile: Dockerfile
      target: site
    image: dmoj-site
    init: true
    restart: unless-stopped
    volumes:
      - assets:/var/opt/lib/dmoj/assets/
      - pdf_cache:/var/cache/dmoj/pdf/
      - data_cache:/var/cache/dmoj/data/
      - mathoid_cache:/var/cache/dmoj/mathoid/
      - texoid_cache:/var/cache/dmoj/texoid/
      - media:/var/opt/lib/dmoj/media/
      - problems:/var/opt/lib/dmoj/problems/
      - log:/var/log/dmoj/
    env_file:
      - env/db.env
      - env/site.env
    networks:
      - site
      - nginx
      - db
    depends_on: [db, redis]
  celery:
    build:
      context: site
      dockerfile: Dockerfile
      target: celery
    image: dmoj-celery
    init: true
    restart: unless-stopped
    volumes:
      - pdf_cache:/var/cache/dmoj/pdf/
      - data_cache:/var/cache/dmoj/data/
      - log:/var/log/dmoj/
    env_file:
      - env/db.env
      - env/site.env
    networks:
      - site
      - db
    depends_on: [db, redis]
  bridged:
    build:
      context: site
      dockerfile: Dockerfile
      target: bridged
    image: dmoj-bridged
    init: true
    restart: unless-stopped
    volumes:
      - pdf_cache:/var/cache/dmoj/pdf/
      - problems:/var/opt/lib/dmoj/problems/
      - log:/var/log/dmoj/
    env_file:
      - env/db.env
      - env/site.env
    networks:
      - site
      - nginx
      - db
    ports:
      - "9999:9999"
    depends_on: [db, redis]
  wsevent:
    build:
      context: site
      dockerfile: Dockerfile
      target: wsevent
    image: dmoj-wsevent
    init: true
    restart: unless-stopped
    networks:
      - site
      - nginx
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: dmoj-nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - assets:/var/opt/lib/dmoj/assets/:ro
      - pdf_cache:/var/cache/dmoj/pdf/:ro
      - data_cache:/var/cache/dmoj/data/:ro
      - mathoid_cache:/var/cache/dmoj/mathoid/:ro
      - texoid_cache:/var/cache/dmoj/texoid/:ro
      - media:/var/opt/lib/dmoj/media/:ro
    networks:
      - nginx
    depends_on: [site, wsevent]

networks:
  site:
  db:
  nginx:

volumes:
  db:
  assets:
  media:
  problems:
  log:
  pdf_cache:
  data_cache:
  mathoid_cache:
  texoid_cache:
