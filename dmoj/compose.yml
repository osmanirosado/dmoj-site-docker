name: dmoj

services:
  db:
    image: mariadb:11.8
    container_name: dmoj-mariadb
    restart: always
    volumes:
      - mariadb_data:/var/lib/mysql/
      - mariadb_backup:/backup
    env_file:
      - env/db.env
    environment:
      - MARIADB_PASSWORD_FILE=/run/secrets/db_password
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    networks:
      - db
  redis:
    image: redis:alpine
    container_name: dmoj-redis
    restart: always
    networks:
      - site
  texoid:
    build:
      context: texoid
      dockerfile: Dockerfile
    image: dmoj-texoid:${IMAGE_TAG:-latest}
    container_name: dmoj-texoid
    init: true
    restart: unless-stopped
    networks:
      - site
  pdfoid:
    build:
      context: pdfoid
      dockerfile: Dockerfile
      args:
        - STORAGE_GOOGLE_APIS=${STORAGE_GOOGLE_APIS:-https://storage.googleapis.com}
    image: dmoj-pdfoid:${IMAGE_TAG:-latest}
    container_name: dmoj-pdfoid
    init: true
    restart: unless-stopped
    networks:
      - site
    cap_add:
      - SYS_ADMIN
  mathoid:
    build:
      context: mathoid
      dockerfile: Dockerfile
    image: dmoj-mathoid:${IMAGE_TAG:-latest}
    container_name: dmoj-mathoid
    init: true
    restart: unless-stopped
    networks:
      - site
  site:
    build:
      context: site
      dockerfile: Dockerfile
      target: site
      args:
        - ONLINE_JUDGE_REPO=${ONLINE_JUDGE_REPO:-https://github.com/DMOJ/online-judge.git}
    image: dmoj-site:${IMAGE_TAG:-latest}
    container_name: dmoj-site
    init: true
    restart: unless-stopped
    volumes:
      - assets:/var/opt/lib/dmoj/assets/
      - user_data_cache:/var/cache/dmoj/user_data/
      - pdfoid_cache:/var/cache/dmoj/pdfoid/
      - mathoid_cache:/var/cache/dmoj/mathoid/
      - texoid_cache:/var/cache/dmoj/texoid/
      - media:/var/opt/lib/dmoj/media/
      - problems:/var/opt/lib/dmoj/problems/
      - logs:/var/log/dmoj/
    env_file:
      - env/db.env
    environment:
      - MARIADB_PASSWORD_FILE=/run/secrets/db_password
      - DJANGO_SECRET_KEY_FILE=/run/secrets/django_secret_key
    secrets:
      - db_password
      - django_secret_key
    networks:
      - site
      - nginx
      - db
    depends_on:
      - db
      - redis
  celery:
    build:
      context: site
      dockerfile: Dockerfile
      target: celery
      args:
        - ONLINE_JUDGE_REPO=${ONLINE_JUDGE_REPO:-https://github.com/DMOJ/online-judge.git}
    image: dmoj-celery:${IMAGE_TAG:-latest}
    container_name: dmoj-celery
    init: true
    restart: unless-stopped
    volumes:
      - pdfoid_cache:/var/cache/dmoj/pdfoid/
      - user_data_cache:/var/cache/dmoj/user_data/
      - logs:/var/log/dmoj/
    env_file:
      - env/db.env
    environment:
      - MARIADB_PASSWORD_FILE=/run/secrets/db_password
      - DJANGO_SECRET_KEY_FILE=/run/secrets/django_secret_key
    secrets:
      - db_password
      - django_secret_key
    networks:
      - site
      - db
    depends_on:
      - db
      - redis
  bridged:
    build:
      context: site
      dockerfile: Dockerfile
      target: bridged
      args:
        - ONLINE_JUDGE_REPO=${ONLINE_JUDGE_REPO:-https://github.com/DMOJ/online-judge.git}
    image: dmoj-bridged:${IMAGE_TAG:-latest}
    container_name: dmoj-bridged
    init: true
    restart: unless-stopped
    volumes:
      - pdfoid_cache:/var/cache/dmoj/pdfoid/
      - problems:/var/opt/lib/dmoj/problems/
      - logs:/var/log/dmoj/
    env_file:
      - env/db.env
    environment:
      - MARIADB_PASSWORD_FILE=/run/secrets/db_password
      - DJANGO_SECRET_KEY_FILE=/run/secrets/django_secret_key
    secrets:
      - db_password
      - django_secret_key
    networks:
      - site
      - nginx
      - db
    ports:
      - "9999:9999"
    depends_on:
      - db
      - redis
  wsevent:
    build:
      context: site
      dockerfile: Dockerfile
      target: wsevent
      args:
        - ONLINE_JUDGE_REPO=${ONLINE_JUDGE_REPO:-https://github.com/DMOJ/online-judge.git}
    image: dmoj-wsevent:${IMAGE_TAG:-latest}
    container_name: dmoj-wsevent
    init: true
    restart: unless-stopped
    networks:
      - site
      - nginx
  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    image: dmoj-nginx:${IMAGE_TAG:-latest}
    container_name: dmoj-nginx
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - assets:/var/opt/lib/dmoj/assets/:ro
      - user_data_cache:/var/cache/dmoj/user_data/:ro
      - pdfoid_cache:/var/cache/dmoj/pdfoid/:ro
      - mathoid_cache:/var/cache/dmoj/mathoid/:ro
      - texoid_cache:/var/cache/dmoj/texoid/:ro
      - media:/var/opt/lib/dmoj/media/:ro
      - resources:/var/opt/lib/dmoj/resources/
    networks:
      - nginx
    depends_on:
      - site
      - wsevent

networks:
  site:
  db:
  nginx:

secrets:
  db_password:
    file: secrets/db_password.txt
  db_root_password:
    file: secrets/db_root_password.txt
  django_secret_key:
    file: secrets/django_secret_key.txt

volumes:
  mariadb_data:
  mariadb_backup:
  assets:
  media:
  resources:
  problems:
  logs:
  user_data_cache:
  pdfoid_cache:
  mathoid_cache:
  texoid_cache:
