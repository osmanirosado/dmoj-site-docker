services:
  db:
    container_name: dmoj-mariadb
    image: mariadb
    restart: always
    volumes:
      - /var/opt/lib/dmoj/db/:/var/lib/mysql/
    env_file: [ env/mysql.env, env/mysql-admin.env ]
    networks: [db]
  redis:
    container_name: dmoj-redis
    image: redis:alpine
    restart: always
    networks: [site]
  texoid:
    build:
      context: texoid
      dockerfile: Dockerfile
    image: dmoj-texoid
    init: true
    restart: unless-stopped
    networks: [site]
  pdfoid:
    build:
      context: pdfoid
      dockerfile: Dockerfile
    image: dmoj-pdfoid
    init: true
    restart: unless-stopped
    networks: [site]
    cap_add:
      - SYS_ADMIN
  mathoid:
    build:
      context: mathoid
      dockerfile: Dockerfile
    image: dmoj-mathoid
    init: true
    restart: unless-stopped
    networks: [site]
  site:
    build:
      context: .
      dockerfile: base/Dockerfile
      target: site
    image: dmoj-site
    init: true
    restart: unless-stopped
    volumes:
      - assets:/var/opt/lib/dmoj/assets/
      - pdf_cache:/var/cache/dmoj/pdf/
      - data_cache:/var/cache/dmoj/data/
      - mathoid_cache:/var/cache/dmoj/mathoid/
      - texoid_cache:/var/cache/dmoj/texoid/
      - /var/opt/lib/dmoj/media/:/var/opt/lib/dmoj/media/
      - /var/opt/lib/dmoj/problems/:/var/opt/lib/dmoj/problems/
      - /var/log/dmoj/:/var/log/dmoj/
    env_file: [ env/mysql.env, env/site.env ]
    networks: [site, nginx, db]
    depends_on: [db, redis]
  celery:
    build:
      context: .
      dockerfile: base/Dockerfile
      target: celery
    image: dmoj-celery
    init: true
    restart: unless-stopped
    volumes:
      - pdf_cache:/var/cache/dmoj/pdf/
      - data_cache:/var/cache/dmoj/data/
      - /var/log/dmoj/:/var/log/dmoj/
    env_file: [ env/mysql.env, env/site.env ]
    networks: [site, db]
    depends_on: [db, redis]
  bridged:
    build:
      context: .
      dockerfile: base/Dockerfile
      target: bridged
    image: dmoj-bridged
    init: true
    restart: unless-stopped
    volumes:
      - pdf_cache:/var/cache/dmoj/pdf/
      - /var/opt/lib/dmoj/problems/:/var/opt/lib/dmoj/problems/
      - /var/log/dmoj/:/var/log/dmoj/
    env_file: [ env/mysql.env, env/site.env ]
    networks: [site, nginx, db]
    ports:
      - "9999:9999"
    depends_on: [db, redis]
  wsevent:
    build:
      context: .
      dockerfile: wsevent/Dockerfile
    image: dmoj-wsevent
    init: true
    restart: unless-stopped
    env_file: [ env/mysql.env, env/site.env ]
    networks: [site, nginx]
  nginx:
    container_name: dmoj-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - assets:/var/opt/lib/dmoj/assets/:ro
      - pdf_cache:/var/cache/dmoj/pdf/:ro
      - data_cache:/var/cache/dmoj/data/:ro
      - mathoid_cache:/var/cache/dmoj/mathoid/:ro
      - texoid_cache:/var/cache/dmoj/texoid/:ro
      - /var/opt/lib/dmoj/media/:/var/opt/lib/dmoj/media/:ro
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks: [nginx]
    depends_on: [site, wsevent]

networks:
  site:
  db:
  nginx:

volumes:
  assets:
  pdf_cache:
  data_cache:
  mathoid_cache:
  texoid_cache:
