services:
  db:
    container_name: dmoj-mysql
    image: mariadb
    restart: always
    volumes:
      - ./data/database/:/var/lib/mysql/
    env_file: [environment/mysql.env, environment/mysql-admin.env]
    networks: [db]
  redis:
    container_name: dmoj-redis
    image: redis:alpine
    restart: always
    networks: [site]
  texoid:
    build:
      context: texoid
      dockerfile: Dockerfile
    image: ninjaclasher/dmoj-texoid
    init: true
    restart: unless-stopped
    networks: [site]
  pdfoid:
    build:
      context: pdfoid
      dockerfile: Dockerfile
    image: ninjaclasher/dmoj-pdfoid
    init: true
    restart: unless-stopped
    networks: [site]
    cap_add:
      - SYS_ADMIN
  mathoid:
    build:
      context: mathoid
      dockerfile: Dockerfile
    image: ninjaclasher/dmoj-mathoid
    init: true
    restart: unless-stopped
    networks: [site]
  site:
    build:
      context: .
      dockerfile: base/Dockerfile
      target: site
    image: ninjaclasher/dmoj-site
    init: true
    restart: unless-stopped
    volumes:
      - assets:/var/lib/dmoj/assets/
      - pdf_cache:/var/cache/dmoj/pdf
      - data_cache:/var/cache/dmoj/data
      - mathoid_cache:/var/cache/dmoj/mathoid
      - texoid_cache:/var/cache/dmoj/texoid
      - ./data/media/:/var/lib/dmoj/media/
      - ./data/problems/:/var/lib/dmoj/problems/
      - ./data/log/:/var/log/dmoj/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx, db]
    depends_on: [db, redis]
  celery:
    build:
      context: .
      dockerfile: base/Dockerfile
      target: celery
    image: ninjaclasher/dmoj-celery
    init: true
    restart: unless-stopped
    volumes:
      - pdf_cache:/var/cache/dmoj/pdf
      - data_cache:/var/cache/dmoj/data
      - ./data/log/:/var/log/dmoj/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, db]
    depends_on: [db, redis]
  bridged:
    build:
      context: .
      dockerfile: base/Dockerfile
      target: bridged
    image: ninjaclasher/dmoj-bridged
    init: true
    restart: unless-stopped
    volumes:
      - pdf_cache:/var/cache/dmoj/pdf
      - ./data/problems/:/var/lib/dmoj/problems/
      - ./data/log/:/var/log/dmoj/
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx, db]
    ports:
      - "9999:9999"
    depends_on: [db, redis]
  wsevent:
    build:
      context: .
      dockerfile: wsevent/Dockerfile
    image: ninjaclasher/dmoj-wsevent
    init: true
    restart: unless-stopped
    env_file: [environment/mysql.env, environment/site.env]
    networks: [site, nginx]
  nginx:
    container_name: dmoj-nginx
    image: nginx:alpine
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - assets:/var/lib/dmoj/assets/
      - pdf_cache:/var/cache/dmoj/pdf
      - data_cache:/var/cache/dmoj/data
      - mathoid_cache:/var/cache/dmoj/mathoid
      - texoid_cache:/var/cache/dmoj/texoid
      - ./data/media/:/var/lib/dmoj/media/
      - ./nginx/conf.d/:/etc/nginx/conf.d/
    networks: [nginx]
    depends_on: [site, wsevent]

networks:
  site:
  db:
  nginx:

volumes:
  assets:
  pdf_cache:
  data_cache:
  mathoid_cache:
  texoid_cache:
  cache:
